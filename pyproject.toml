[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "elite-companion"
version = "0.1.0"
description = "Windows background app that streams Elite: Dangerous flight data to ESP32 displays"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0",
    "pyserial>=3.5",
    "psutil>=5.9",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.scripts]
elite-companion = "elite_companion.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["elite_companion*"]
